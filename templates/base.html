<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="InfraRisk Analyzer demonstration change-risk review board for proposed IT changes.">
    <title>{% block title %}InfraRisk Analyzer{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{{ url_for('index') }}" aria-label="InfraRisk Analyzer home">
            <svg class="brand-mark" viewBox="0 0 64 64" role="img" aria-labelledby="logo-title">
                <title id="logo-title">Server rack with warning triangle</title>
                <rect class="server-rack" x="12" y="10" width="28" height="44" rx="4"/>
                <path class="warning-triangle" d="M43 22 58 50H28Z"/>
                <path class="server-line" d="M18 20h16M18 32h16M18 44h10"/>
                <circle class="server-light" cx="32" cy="44" r="2"/>
                <path class="warning-mark" d="M43 32v9M43 46h.01"/>
            </svg>
            <span>InfraRisk Analyzer</span>
        </a>
        <nav aria-label="Primary navigation">
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('explore') }}">Change Review Board</a>
            <a href="{{ url_for('external_intelligence_review') }}">External Intelligence Review</a>
        </nav>
    </header>

    <main>{% block content %}{% endblock %}</main>

    <footer>
        <p>Created by Isaac Lares for IT 401 at CSU Channel Islands.</p>
        <p>Demonstration data, not a production change-management or approval system.</p>
    </footer>
</body>
</html>
